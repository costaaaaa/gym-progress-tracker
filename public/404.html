<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata · LiftIndex</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#d50000">
  <link rel="icon" href="/favicon.ico">
  <style>
    /* Font e colori dell'app (src/index.css, ThemeModeContext.jsx). Pagina senza script. */
    @font-face{font-family:'Lexend';font-weight:100 900;font-display:swap;src:url('/fonts/lexend-latin-wght-normal.woff2') format('woff2')}
    @font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url('/fonts/inter-latin-wght-normal.woff2') format('woff2')}
    :root{color-scheme:light;--ground:#f7f6f5;--ink:#1a1816;--muted:#6b6663;--accent:#d50000;--accent-text:var(--accent);--accent-press:#9b0000;--on-accent:#ffffff}
    @media (prefers-color-scheme:dark){:root{color-scheme:dark;--ground:#0a0a0b;--ink:#ffffff;--muted:#a0a0a2;--accent-text:#ff5252}}
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;background:var(--ground);color:var(--ink);font:400 17px/1.55 'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .frame{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
    header.frame{padding-top:28px}
    .wordmark{font:600 1.25rem/1 'Lexend',sans-serif;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-top:clamp(32px,6vh,72px);padding-bottom:clamp(48px,10vh,120px)}
    .stage{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:clamp(40px,6vw,96px)}
    .figure{margin:0 0 0 -.04em;font:700 clamp(9rem,24vw,21rem)/.8 'Lexend',sans-serif;letter-spacing:-.06em;color:var(--accent-text);font-variant-numeric:tabular-nums}
    .copy h1{margin:0 0 12px;font:600 clamp(2rem,3.4vw,3rem)/1.08 'Lexend',sans-serif;letter-spacing:-.03em}
    .copy p{margin:0 0 24px;font-size:1.0625rem}
    .copy .en{margin:40px 0 0;color:var(--muted)}
    .en strong{color:var(--ink);font-weight:600}
    .en a{color:var(--ink);font-weight:600;text-underline-offset:3px;text-decoration-thickness:2px;text-decoration-color:var(--accent-text)}
    .en a:hover{color:var(--accent-text)}
    .en a:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:2px}
    .go{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 24px;border-radius:999px;background:var(--accent);color:var(--on-accent);font:600 1rem/1 'Inter',sans-serif;text-decoration:none;transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .16s}
    .go:hover{transform:translateY(-2px)}
    .go:active{transform:translateY(0) scale(.98);background:var(--accent-press)}
    .go:focus-visible,.wordmark:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
    .go span{transition:transform .16s cubic-bezier(.2,.8,.2,1)}
    .go:hover span{transform:translateX(3px)}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    /* Le tre cifre arrivano una dopo l'altra, come dischi caricati sul bilanciere. */
    .figure span{display:inline-block}
    .wordmark,.figure span,.copy>*{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
    .figure span:nth-child(2){animation-delay:.08s}.figure span:nth-child(3){animation-delay:.16s}.copy>:nth-child(1){animation-delay:.14s}.copy>:nth-child(2){animation-delay:.21s}.copy>:nth-child(3){animation-delay:.28s}.copy>:nth-child(4){animation-delay:.35s}
    @media (prefers-reduced-motion:reduce){.wordmark,.figure span,.copy>*{animation:none}.go,.go span{transition:none}.go:hover,.go:hover span{transform:none}}
    @media (max-width:900px){
      .stage{grid-template-columns:1fr;gap:clamp(32px,6vh,56px)}
      /* Il 404 riempie la cornice: la larghezza delle tre cifre è circa 1,86 volte il corpo. */
      .figure{font-size:calc((100vw - 2 * clamp(16px,4vw,32px)) / 1.86)}
    }
  </style>
</head>
<body>
<header class="frame">
  <a class="wordmark" href="/">LiftIndex</a>
</header>
<main class="frame">
  <div class="stage">
    <p class="figure" aria-hidden="true"><span>4</span><span>0</span><span>4</span></p>
    <div class="copy">
      <h1>Pagina non trovata</h1>
      <p>Questo indirizzo non esiste o è stato spostato. Riparti dalla home e torna al tuo allenamento.</p>
      <a class="go" href="/">Vai alla home <span aria-hidden="true">→</span></a>
      <p class="en" lang="en"><strong>Page not found.</strong> This address doesn't exist or has moved. <a href="/en/">Go to the English home page</a></p>
    </div>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GYM PROGRESS TRACKER</title>
  <script>
    // Single Page Apps for GitHub Pages or any static hosting
    // This script takes the current URL and converts the path and query
    // string into just a query string, and then redirects the browser
    // to the new URL with only a query string and hash fragment.
    
    // Since we're using "/gym-progress-tracker-v2/" as homepage in package.json, we need to set the basename
    const basename = '/gym-progress-tracker-v2';
    
    // Redirect to the correct URL
    const redirect = () => {
      // Get the current path relative to the basename
      const path = window.location.pathname.replace(basename, '');
      
      // If this is a direct hit on the 404.html page, redirect to the homepage
      if (path === '/404.html') {
        window.location.href = basename + '/';
        return;
      }
      
      // Save the full path (including the hash) to sessionStorage
      sessionStorage.setItem('redirect', path + window.location.search + window.location.hash);
      
      // Redirect to the homepage with a special parameter
      window.location.href = basename + '/?redirect=true';
    };
    
    redirect();
  </script>
</head>
<body>
  Redirecting...
</body>
</html>

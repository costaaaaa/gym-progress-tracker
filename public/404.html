<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagina non trovata · LiftIndex</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico">
  <style>
    :root{color-scheme:light dark;--bg:#fff;--ink:#1b1f22;--muted:#586067;--line:#d9dde0;--accent:#d50000}
    @media (prefers-color-scheme:dark){:root{--bg:#121517;--ink:#e4e7e2;--muted:#9aa3a9;--line:#2e3438;--accent:#ff6e6e}}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 16px}
    main{max-width:560px;margin:0 auto;padding:64px 0}
    .code{color:var(--accent);font-weight:700;font-size:.9rem;letter-spacing:.08em;margin:0 0 8px}
    h1{font-size:1.75rem;line-height:1.2;margin:0 0 8px}
    p{margin:0 0 16px;color:var(--muted)}
    a{color:var(--accent);font-weight:600}
    section+section{margin-top:32px;padding-top:24px;border-top:1px solid var(--line)}
  </style>
</head>
<body>
<main>
  <section>
    <p class="code">404</p>
    <h1>Pagina non trovata</h1>
    <p>L'indirizzo che hai aperto non esiste o non esiste più.</p>
    <a href="/">Vai alla home di LiftIndex</a>
  </section>
  <section lang="en">
    <h1>Page not found</h1>
    <p>The address you opened doesn't exist or is no longer available.</p>
    <a href="/en/">Go to the LiftIndex home page</a>
  </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Gym Progress Tracker - Monitora i tuoi progressi in palestra"
    />
    <title>Gym Progress Tracker v2.0</title>
    <script>
      // Handle redirects from 404.html (for SPA routing on static hosts)
      (function () {
        if (window.location.search.includes("redirect=true")) {
          const savedPath = sessionStorage.getItem("redirect");
          if (savedPath) {
            sessionStorage.removeItem("redirect");
            window.history.replaceState(null, null, savedPath);
          }
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
